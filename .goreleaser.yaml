# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: else.sh

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: else.sh
    main: ./cmd/else.sh
    binary: else.sh
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ignore:
      - goos: freebsd
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/cristi-boboc/else.sh/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

# Published only when the TAP_DEPLOY_KEY secret exists (an SSH deploy key with
# write access to both repos), so releases keep working without it.
homebrew_casks:
  - name: else.sh
    binaries: [else.sh]
    homepage: https://cristi-boboc.github.io/else.sh/
    description: Type a prompt in your shell and your coding agent picks it up
    license: MIT
    skip_upload: '{{ if eq (envOrDefault "TAP_DEPLOY_KEY" "") "" }}true{{ else }}false{{ end }}'
    repository:
      owner: cristi-boboc
      name: homebrew-tap
      git:
        url: git@github.com:cristi-boboc/homebrew-tap.git
        private_key: '{{ envOrDefault "TAP_DEPLOY_KEY" "" }}'
    commit_msg_template: "else.sh {{ .Tag }}"
    caveats: "Run `else.sh install` to hook your shell and pick a default agent."
    hooks:
      post:
        # The binary isn't notarized; drop the quarantine flag so Gatekeeper lets it run.
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/else.sh"]

scoops:
  - name: else.sh
    homepage: https://cristi-boboc.github.io/else.sh/
    description: Type a prompt in your shell and your coding agent picks it up
    license: MIT
    skip_upload: '{{ if eq (envOrDefault "TAP_DEPLOY_KEY" "") "" }}true{{ else }}false{{ end }}'
    repository:
      owner: cristi-boboc
      name: scoop-bucket
      git:
        url: git@github.com:cristi-boboc/scoop-bucket.git
        private_key: '{{ envOrDefault "TAP_DEPLOY_KEY" "" }}'
    commit_msg_template: "else.sh {{ .Tag }}"
    post_install: ["Write-Host 'Run else.sh install to hook PowerShell and pick a default agent.'"]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:", "^ci:"]

release:
  footer: |
    ## Install

    **macOS / Linux / WSL**
    ```sh
    curl -fsSL https://cristi-boboc.github.io/else.sh/install.sh | sh
    ```

    **Windows (PowerShell)**
    ```powershell
    irm https://cristi-boboc.github.io/else.sh/install.ps1 | iex
    ```
